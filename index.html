<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planejador Financeiro · InvestSmart</title>
<style>
:root{
  --purple:#9966FF; --purple-ink:#8452F5; --on-purple:#000; --lime:#EBFF70;
  --bg:#F8F1ED; --surface:#FFFFFF; --text:#000000; --muted:#5A5A5A; --line:#D9D2CE;
  --soft:#F8F1ED; --good:#1F7A4F; --warn:#9A5B00; --bad:#C2273A;
  --f-text:Barlow,Arial,sans-serif; --f-title:Roundkey,Arial,sans-serif; --f-display:Knockout,"Arial Narrow",Arial,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#000000;--surface:#202020;--text:#FFFFFF;--muted:#A6A6A6;--line:#3A3A3A;--soft:#2A2A2A;--purple-ink:#B08AFF;--good:#4CC38A;--warn:#F0A44B;--bad:#FF6B7D;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#000000;--surface:#202020;--text:#FFFFFF;--muted:#A6A6A6;--line:#3A3A3A;--soft:#2A2A2A;--purple-ink:#B08AFF;--good:#4CC38A;--warn:#F0A44B;--bad:#FF6B7D;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--f-text);font-size:15.5px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#000}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.app{display:grid;grid-template-columns:262px minmax(0,1fr) 330px;min-height:100vh}
.app.home{grid-template-columns:262px minmax(0,1fr)}
.app.home aside.panel{display:none}
.rail{background:#000;color:#fff;padding:26px 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px;overflow:auto}
.wordmark{font-weight:700;font-size:26px;line-height:1;letter-spacing:-.5px}
.wordmark span{color:#9966FF}
.brand small{color:#A6A6A6;font-size:13px;display:block;margin-top:4px}
.back{all:unset;cursor:pointer;font-size:13px;color:#fff;padding:8px 12px;border-radius:999px;border:1px solid #3A3A3A}
.back:hover{background:#202020}
.client-chip{background:#202020;border:1px solid #3A3A3A;border-radius:14px;padding:12px 14px}
.client-chip b{display:block;font-size:14px}
.client-chip span{font-size:12px;color:#A6A6A6}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps button{all:unset;cursor:pointer;display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:10px;color:#E6E6E6;font-size:14px}
.steps button:hover{background:#202020}
.steps .n{width:24px;height:24px;border-radius:50%;border:1.5px solid #4A4656;display:grid;place-items:center;font-size:11.5px;font-weight:600}
.steps li.done .n{background:#3A3A3A;border-color:#3A3A3A;color:#9966FF}
.steps li.active button{background:#EBFF70;color:#000}
.steps li.active .n{border-color:#000;background:#000;color:#EBFF70}
.steps .dot{width:7px;height:7px;border-radius:50%;background:#FFB547}
.save-state{margin-top:auto;font-size:12px;color:#8F8A9E;display:flex;flex-direction:column;gap:4px}
.save-state b{color:#fff;font-weight:600}
.save-state .ok::before,.save-state .off::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:#4CC38A}
.save-state .off::before{background:#4A4656}
main{padding:34px 38px 80px;min-width:0}
.idx{font-size:13px;color:var(--muted)}
h1{font-family:var(--f-title);font-weight:700;font-size:32px;line-height:1.1;margin:4px 0 8px;letter-spacing:-.01em}
.lead{color:var(--muted);max-width:68ch;margin:0 0 22px}
h2{font-family:var(--f-title);font-weight:700;font-size:18px;margin:0 0 12px}
h3{font-family:var(--f-title);font-weight:700;font-size:15.5px;margin:0 0 8px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;align-items:end}
.field label{line-height:1.3}
.kpis{align-items:stretch}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;color:var(--muted)}
.field input,.field select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
.field input:focus,.field select:focus{border-color:var(--purple);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--purple) 22%,transparent)}
.field .calc{background:transparent;border-style:dashed;color:var(--muted)}
.field input.num{text-align:right;font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.row-list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;gap:10px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.row .field input,.row .field select{background:var(--surface)}
.del{all:unset;cursor:pointer;width:34px;height:38px;display:grid;place-items:center;border-radius:9px;color:var(--muted)}
.del:hover{background:var(--soft);color:var(--bad)}
.btn{border:0;cursor:pointer;border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:var(--purple);color:var(--on-purple)}
.btn-primary:hover{background:var(--purple-ink)}
.btn-dark{background:#000;color:#fff;border:1px solid #3A3A3A}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--purple)}
.btn-add{background:var(--soft);color:var(--text);border:1px solid var(--line);margin-top:12px}
.btn-add::before{content:"";width:14px;height:7px;border-radius:0 999px 999px 0;background:var(--purple)}
.btn-sm{padding:6px 12px;font-size:13px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
.toggle{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-top:12px;cursor:pointer}
.toggle input{margin-top:4px;accent-color:var(--purple);width:16px;height:16px;flex:0 0 auto}
.callout{border-left:3px solid var(--purple);background:var(--soft);padding:12px 14px;border-radius:0 12px 12px 0;font-size:14px;margin-top:14px}
.callout.warn{border-color:var(--warn)} .callout.bad{border-color:var(--bad)} .callout.good{border-color:var(--good)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:14px 16px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.kpi span{font-size:12.5px;color:var(--muted);display:block}
.kpi b{font-family:var(--f-title);font-weight:700;font-size:20px;letter-spacing:-.01em;display:block}
.pos{color:var(--good)} .neg{color:var(--bad)} .mut{color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line)}
.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t td.r,.t th.r{text-align:right;font-variant-numeric:tabular-nums}
.t tr.tot td{font-weight:600;border-bottom:0}
.t input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%;min-width:60px}
.t input.num{text-align:right}
.scroll{overflow-x:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px}
.tabs button.on{background:var(--purple);color:#000;border-color:var(--purple)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:14px}
.opt{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--bg)}
.opt.sel{border-color:var(--purple);box-shadow:inset 0 0 0 1px var(--purple);background:var(--surface)}
.opt.best{position:relative}
.idxw{margin-top:12px}.idxbar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:12px}.idxbar input{accent-color:var(--purple);width:100%}
.cheap{margin-top:10px;background:#EBFF70;color:#000;border-radius:8px;padding:8px 10px;font-size:12.5px;font-weight:600}
.prio{display:flex;flex-wrap:wrap;gap:8px}
.prio button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px 7px 8px;cursor:pointer;font-size:13.5px}
.prio button .pn{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-title);font-weight:700;font-size:11px}
.prio button.on{border-color:var(--purple);background:var(--surface)}
.prio button.on .pn{background:var(--purple);border-color:var(--purple);color:#000}
.prio-list{margin:12px 0 0;padding-left:20px;font-size:14px;columns:2;column-gap:28px}
.opt-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.opt-head small{font-weight:600;font-size:13px}
.pick{border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:12px;padding:4px 10px;cursor:pointer}
.opt.sel .pick{background:var(--purple);color:#000;border-color:var(--purple)}
.opt b.v{display:block;font-family:var(--f-title);font-weight:700;font-size:19px;margin:6px 0 2px}
.opt dl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:12.5px;margin:8px 0 0}
.opt dt{color:var(--muted)} .opt dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.opt .grid{grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin-top:10px}
.opt .field input{padding:7px 9px;background:var(--surface)}
aside.panel{border-left:1px solid var(--line);background:var(--surface);padding:28px 22px;position:sticky;top:0;height:100vh;overflow:auto}
.panel .sub{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.metric{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px}
.verdict{margin:16px 0 8px;padding:16px;border-radius:14px;background:#000;color:#fff}
.verdict span{font-size:12.5px;color:#C9C4D6}
.verdict b{display:block;font-family:var(--f-title);font-size:21px;color:#9966FF}
.verdict p{margin:6px 0 0;font-size:12.5px;color:#C9C4D6}
.light{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}
.todo{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.todo li{font-size:13px;display:flex;gap:8px}
.todo li::before{content:"";flex:0 0 8px;height:8px;border-radius:50%;margin-top:6px;background:#FFB547}
.todo li.ok::before{background:var(--good)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:6px;vertical-align:3px}
/* home */
.home-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.hk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}
.hk button{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.hk button.on{border-color:var(--purple);box-shadow:inset 0 0 0 1px var(--purple)}
.hk span{font-size:12.5px;color:var(--muted);display:block}
.hk b{font-family:var(--f-title);font-weight:700;font-size:28px}
.filters{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.filters input{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 16px}
.clist{display:flex;flex-direction:column;gap:8px}
.crow{display:grid;grid-template-columns:minmax(0,2.2fr) 1fr 1.2fr 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.crow b{display:block}
.crow small{color:var(--muted);font-size:12.5px}
.chipst{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;display:inline-block}
.st-rascunho{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.st-andamento{background:#EBFF70;color:#000}
.st-concluido{background:#9966FF;color:#000}
.st-revisar{background:#FFE3E5;color:#9B1C2C}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--purple)}
.cact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{text-align:center;padding:40px 20px;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}
.store{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.store .block{margin:0}
.store p{font-size:13px;color:var(--muted);margin:4px 0 12px}

/* report — identidade InvestSmart (Guia de Marca 1.3) */
.rep-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end}
.pages{display:flex;flex-direction:column;gap:22px;align-items:center}
.page{--r:#9966FF;--n:#EBFF70;--ow:#F8F1ED;--dv:#D9D2CE;--mu:#5A5A5A;width:210mm;max-width:100%;min-height:297mm;background:#fff;color:#000;box-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 30px rgba(20,10,50,.08);display:flex;flex-direction:column;font-family:Barlow,Arial,sans-serif;font-size:12.5px;line-height:1.5;position:relative;overflow:hidden}
.pg-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:26px 34px 14px;border-bottom:1px solid var(--dv)}
.pg-head .rot{display:flex;align-items:center;gap:8px;font-weight:600;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.pg-head .rot i{display:inline-block;width:22px;height:9px;border-radius:0 999px 999px 0;background:var(--r)}
.pg-head h3{font-family:Roundkey,Arial,sans-serif;font-weight:700;font-size:25px;line-height:1.08;margin:6px 0 0;letter-spacing:-.01em}
.pg-head img{height:30px;width:auto;flex:0 0 auto}
.pg-body{padding:20px 34px;flex:1;display:flex;flex-direction:column;gap:14px}
.pg-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 34px 16px;border-top:1px solid var(--dv);font-size:9.5px;color:var(--mu)}
.pg-foot .pn{font-family:Roundkey,Arial,sans-serif;font-weight:700;font-size:12px;color:#000;white-space:nowrap}
.page h4{font-family:Roundkey,Arial,sans-serif;font-weight:700;font-size:14.5px;margin:2px 0 6px;color:#000}
.page p{margin:0}
.page .muted{color:var(--mu)}
.page .t{font-size:11.5px;font-family:Barlow,Arial,sans-serif}
.page .t th{color:var(--mu);border-bottom:1.5px solid #000;font-size:10px;font-weight:600;padding:6px 8px;text-transform:none}
.page .t td{border-bottom:1px solid var(--dv);padding:6px 8px}
.page .t tr.tot td{font-weight:700}
.page .t tr.rec td{background:var(--ow);font-weight:600}
.page .t tr.rec td:first-child{box-shadow:inset 4px 0 0 var(--r)}
.page .legend{color:var(--mu)}
.rk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rk div{background:var(--ow);border-radius:8px;padding:10px 12px}
.rk span{display:block;font-size:10px;color:var(--mu);font-weight:600}
.rk b{font-family:Roundkey,Arial,sans-serif;font-weight:700;font-size:17px;letter-spacing:-.01em}
.rk div.hl{background:var(--n)}.rk div.hl span{color:#000}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.note{background:var(--ow);border-radius:8px;padding:10px 12px;font-size:11.5px;box-shadow:inset 4px 0 0 var(--r)}
.note b{font-weight:700}
.sem{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--ow)}
.sem .lights{display:flex;flex-direction:column;gap:5px;background:#000;padding:8px;border-radius:999px}
.sem .lights i{width:14px;height:14px;border-radius:50%;background:#2E2B36}
.sem .lights i.on.g{background:#2BB673}.sem .lights i.on.y{background:#F5C518}.sem .lights i.on.r{background:#E5484D}
.sem b{font-family:Roundkey,Arial,sans-serif;font-size:18px}
.actions{counter-reset:a;display:grid;gap:8px}
.act{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--dv);border-radius:8px}
.act::before{counter-increment:a;content:counter(a);width:24px;height:24px;border-radius:50%;background:var(--r);color:#000;display:grid;place-items:center;font-family:Roundkey,Arial,sans-serif;font-weight:700;font-size:11px}
.act b{display:block;font-size:12.5px;font-weight:700}
.act span{color:var(--mu);font-size:11.5px}
.act em{font-style:normal;font-family:Roundkey,Arial,sans-serif;font-weight:700;white-space:nowrap}
.cover{background:#000;color:#fff;justify-content:space-between;container-type:inline-size}
.cover .ctop{padding:44px 48px 0;display:flex;justify-content:space-between;align-items:flex-start}
.cover .ctop img{width:210px;height:auto}
.cover .graf{position:absolute;right:0;top:250px;width:58%;height:auto}
.cover .ct{padding:0 48px 54px;position:relative}
.cover .pill{display:inline-block;background:#EBFF70;color:#000;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;border-radius:999px;margin-bottom:18px}
.cover h5{font-family:Knockout,"Arial Narrow",Arial,sans-serif;font-weight:700;font-size:min(56px,7.2cqw);line-height:.98;margin:0;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap}
.cover h5 span{color:#9966FF}
.cover .who{font-family:Roundkey,Arial,sans-serif;font-weight:700;font-size:24px;margin-top:22px}
.cover .meta{margin-top:30px;font-size:11.5px;color:#A6A6A6;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-top:1px solid #3A3A3A;padding-top:14px}
.chev{display:grid;grid-template-columns:repeat(2,96px);gap:12px}
.chev i{height:116px;background:#9966FF;border-radius:14px;clip-path:polygon(0 0,62% 0,100% 50%,62% 100%,0 100%)}
/* presentation */
.pres{position:fixed;inset:0;z-index:50;background:#000;color:#fff;display:flex;flex-direction:column}
.pres-top{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 24px 10px;gap:12px}
.pres-top .wordmark{font-size:20px}
.pres-top .btn{background:#202020;color:#fff;border:1px solid #3A3A3A}
.pres-stage{flex:1;display:grid;place-items:center;padding:8px 24px;min-height:0}
.slide{font-family:var(--f-text);width:min(100%,calc((100vh - 150px) * 16 / 9));aspect-ratio:16/9;background:#000000;border:1px solid #3A3A3A;border-radius:20px;padding:4.2% 5%;display:flex;flex-direction:column;gap:2.2%;overflow:hidden;font-size:clamp(12px,1.25vw,18px)}
.slide{font-family:Barlow,Arial,sans-serif}.slide h2{font-family:Roundkey,Arial,sans-serif;font-size:2.1em;margin:0;letter-spacing:-.01em;line-height:1.1}
.slide .kick{color:#9966FF;font-size:.95em}
.slide p{margin:0;color:#E6E6E6;max-width:62ch}
.slide .big{font-family:Knockout,'Arial Narrow',Arial,sans-serif;font-size:4.8em;font-weight:700;color:#EBFF70;line-height:.95}
.slide .sk{display:grid;grid-template-columns:repeat(4,1fr);gap:1em}
.slide .sk div{background:#202020;border:1px solid #3A3A3A;border-radius:14px;padding:.9em 1em}
.slide .sk span{display:block;font-size:.78em;color:#A6A6A6}
.slide .sk b{font-size:1.45em;letter-spacing:-.02em}
.slide .chart{flex:1 1 auto;min-height:140px;display:flex;flex-direction:column}.slide .chart>svg{flex:1 1 auto;min-height:0;width:100%}
.slide .chart svg{height:100%;max-height:100%}
.slide .legend{color:#A6A6A6}
.slide .ctrl{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2em}
.slide .ctrl label{display:flex;flex-direction:column;gap:.3em;font-size:.82em;color:#A6A6A6}
.slide .ctrl b{color:#fff;font-size:1.15em}
.slide input[type=range]{accent-color:#EBFF70;width:100%}
.slide .row2{display:grid;grid-template-columns:1.3fr 1fr;gap:4%;flex:1;min-height:0}
.slide .lst{display:flex;flex-direction:column;gap:.6em}
.slide .lst div{background:#202020;border:1px solid #3A3A3A;border-radius:12px;padding:.7em 1em;display:flex;justify-content:space-between;gap:1em}
.slide .lst span{color:#A6A6A6}
.pres-nav{display:flex;justify-content:center;align-items:center;gap:14px;padding:10px 24px calc(16px + env(safe-area-inset-bottom,0px))}
.pres-nav button.arrow{background:#202020;border:1px solid #3A3A3A;color:#fff;border-radius:999px;width:44px;height:44px;cursor:pointer;font-size:18px}
.dots{display:flex;gap:6px}
.dots button{width:9px;height:9px;border-radius:50%;border:0;background:#3A3A3A;cursor:pointer;padding:0}
.dots button.on{background:#EBFF70;width:26px;border-radius:5px}
.modal{position:fixed;inset:0;background:rgba(10,8,20,.55);z-index:60;display:grid;place-items:center;padding:20px}
.modal .box{background:var(--surface);border-radius:18px;padding:22px;max-width:460px;width:100%}
.mobile-steps{display:none}
@media (max-width:1200px){
  .app{grid-template-columns:240px minmax(0,1fr)}
  aside.panel{grid-column:2;position:static;height:auto;border-left:0;border-top:1px solid var(--line)}
  .hk{grid-template-columns:repeat(3,1fr)} .store{grid-template-columns:1fr}
}
@media (max-width:860px){
  .app,.app.home{grid-template-columns:1fr}
  .rail{position:sticky;top:0;height:auto;padding:12px 16px;z-index:5;flex-direction:row;align-items:center;flex-wrap:wrap;gap:10px}
  .rail .steps,.rail .client-chip,.brand small{display:none}
  .save-state{margin:0 0 0 auto}
  .wordmark{font-size:20px}
  .mobile-steps{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
  .mobile-steps button{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
  .mobile-steps button.active{background:#EBFF70;color:#000;border-color:#EBFF70}
  main{padding:22px 16px 60px} aside.panel{grid-column:1}
  .opts{grid-template-columns:1fr} h1{font-size:24px}
  .crow{grid-template-columns:1fr 1fr}.cact{grid-column:1/-1;justify-content:flex-start}
  .hk{grid-template-columns:repeat(2,1fr)}
  .page{min-height:auto}.rk{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}
  .slide{aspect-ratio:auto;height:100%;font-size:13px}.slide .sk{grid-template-columns:1fr 1fr}.slide .row2,.slide .ctrl{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.step-body{animation:in .2s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}}
@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .rail,.mobile-steps,aside.panel,.no-print,.idx,h1,.lead,.nav,.pres,.modal{display:none!important}
  .app{display:block} main{padding:0}
  .pages{gap:0}
  .page{box-shadow:none;width:210mm;min-height:297mm;height:297mm;break-after:page;page-break-after:always}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="rail" id="rail" aria-label="Navegação"></nav>
  <div class="mobile-steps" id="mSteps"></div>
  <main id="main"></main>
  <aside class="panel" id="panelWrap" aria-label="Resumo do cliente"><h3>Raio-X do cliente</h3><p class="sub">Atualiza a cada campo preenchido.</p><div id="panel"></div></aside>
</div>
<div id="overlay"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden><input type="file" id="importForms" accept=".xlsx,.xls,.csv" hidden>

function scheduleSave(){SAVE.pending=true;clearTimeout(saveTimer);saveTimer=setTimeout(flushSave,500);paintSave()}
async function flushSave(){

  const ids=[...dirtyIds];dirtyIds.clear();SAVE.pending=false;paintSave();
  if(CLOUD.db&&CLOUD.uid){try{SAVE.cloud='saving';paintSave();
    for(const id of ids){const c=DB.clients[id];const ref=CLOUD.db.collection('data/users/'+CLOUD.uid).doc('c_'+id);if(c)await ref.set(c);else await ref.delete()}

const CLOUD={db:null,uid:null,tried:false};
async function initCloud(){
  if(!window.claude||typeof window.claude.use!=='function'){SAVE.cloud='na';paintSave();return}
  try{const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user){SAVE.cloud='na';paintSave();return}
    const id=await user.id(); if(!id){SAVE.cloud='na';paintSave();return}
    CLOUD.db=db;CLOUD.uid=id;SAVE.cloud='saving';paintSave();
    const snap=await db.collection('data/users/'+id).get();let changed=false;
    snap.docs.forEach(d=>{const v=d.data();if(!v)return;
      if(d.id==='settings'&&v.settings){DB.settings=Object.assign(DB.settings,v.settings)}
      else if(d.id.startsWith('c_')&&v.id){const loc=DB.clients[v.id];if(!loc||(v.updatedAt||0)>(loc.updatedAt||0)){normalize(v.data);DB.clients[v.id]=v;changed=true}}});
    const cloudIds=new Set(snap.docs.map(d=>d.id));
    Object.values(DB.clients).forEach(c=>{if(!cloudIds.has('c_'+c.id))dirtyIds.add(c.id)});
    if(dirtyIds.size)await flushSave();else{SAVE.cloud='ok';SAVE.cloudAt=Date.now()}
    if(changed){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}} if(VIEW==='home')render();
    paintSave();
  }catch(e){SAVE.cloud='err';paintSave()}
}

async function writeFolder(){const h=FOLDER.handle;if(!h)return;if((await h.queryPermission({mode:'readwrite'}))!=='granted'){if((await h.requestPermission({mode:'readwrite'}))!=='granted'){SAVE.folder='perm';return}}

function mergeImport(v,quiet){if(!v||!v.clients)throw new Error('Arquivo sem clientes');let n=0;
  Object.entries(v.trash||{}).forEach(([id,t])=>{const loc=DB.clients[id];if(loc&&(t.deletedAt||0)>(loc.updatedAt||0)){DB.trash[id]=t;delete DB.clients[id];n++}else if(!loc&&!DB.trash[id])DB.trash[id]=t});
  Object.values(v.clients).forEach(c=>{const loc=DB.clients[c.id],tr=DB.trash[c.id];if(tr&&(tr.deletedAt||0)>(c.updatedAt||0))return;if(!loc||(c.updatedAt||0)>(loc.updatedAt||0)){if(tr)delete DB.trash[c.id];normalize(c.data);DB.clients[c.id]=c;dirtyIds.add(c.id);n++}});
  if(v.settings)DB.settings=Object.assign(DB.settings,v.settings);scheduleSave();return n}
async function downloadFile(filename,data,mime){
  try{if(window.claude){const d=await window.claude.use('downloads');if(d){await d.save({filename,data});return true}}}catch(e){if(e&&e.code==='declined')return false}

}

  const filhos=ks.map(k=>{const a0=monthsSince(k.nasc),ate=num(k.coberturaAte)||24,rest=Math.max(0,ate*12-Math.max(0,a0)),c=kidCostByAge(k);
    const arr=[];for(let m=0;m<rest;m++){const a=Math.floor((Math.max(0,a0)+m)/12);arr.push(a<=40?c[a]:0)}return {nome:k.nome,idade:ageOf(k.nasc),ate,anos:Math.round(rest/12),v:pvMonthly(arr)}});
  const anosDia=S.protecao.anos!==''&&num(S.protecao.anos)>0?num(S.protecao.anos):(filhos.length?Math.max(...filhos.map(f=>f.anos),1):num(S.protecao.anosSemFilhos)||10);
  const diaDia=pvMonthly(Array(Math.round(anosDia*12)).fill(sim.base*famPct()/100));
  const filhosT=filhos.reduce((s,e)=>s+e.v,0);
  const projProt=S.protecao.incluirProjetos?projs.reduce((s,p)=>s+num(p.valor),0):0;
  const suc=S.sucessao, extraPct=(num(suc.advog)+num(suc.custas))/100;
  const invOf=base=>{const it=itcmdCalc(base,suc,S.cliente.uf);return {itcmd:it.v,ef:it.ef,met:it.met,outros:base*extraPct,total:it.v+base*extraPct,base}};
  const invHoje=invOf(Math.max(0,fin-prev+imob));
  const necessidade=diaDia+filhosT+divida+projProt+invHoje.total+num(S.protecao.funeral);
  const garantias=fin+num(S.protecao.seguroAtual);
  const gap=Math.max(0,necessidade-garantias);
  const dit=rendaTrab(), dg=despesaTotal*num(S.protecao.mesesDG);
  const rowOf=(s,age)=>{const y=s.years.find(y=>y.idade===age)||s.years.at(-1);return y};
  const sucAt=(s,age)=>{const y=rowOf(s,age);return invOf(Math.max(0,y.fim)*(1-s.prevShare)+y.imob)};
  const sucCur=[invHoje,sucAt(sim,idApos),sucAt(sim,expect-1)], sucPlan=[invHoje,sucAt(planSim,idApos),sucAt(planSim,expect-1)];
  const sucSeries=s=>s.years.map(y=>[y.idade,invOf(Math.max(0,y.fim)*(1-s.prevShare)+y.imob).total]);
  return {idade,sim,planSim,planExtra,R,parcelas,despesaTotal,sobra,fin,imob,prev,divida,pl:fin+imob-divida,projs,compromisso,
    sobraLivre:sobra-compromisso-projInvest,projInvest,projGap:sim.minPre<0?{idade:sim.minPreAge,valor:-sim.minPre}:null,extraConsumir,extraPreservar,rendaSust,sens,light,idApos,expect,
    filhos,anosDia,diaDia,filhosT,projProt,invHoje,necessidade,garantias,gap,dit,dg,sucCur,sucPlan,sucSeries,invOf};
}

function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(Math.abs(raw)||1)));const n=raw/p;return (n<1.5?1:n<3?2:n<7?5:10)*p}
function lineChart({series,W=720,H=260,markers=[],ink='currentColor',grid='#E6E6E6'}){
  const pl=66,pr=14,pt=16,pb=30, xs=series.flatMap(s=>s.pts.map(p=>p[0])), ys=series.flatMap(s=>s.pts.map(p=>p[1]));
  if(!xs.length)return '';
  const x0=Math.min(...xs),x1=Math.max(...xs); let y0=Math.min(0,...ys),y1=Math.max(0,...ys); if(y1===y0)y1=y0+1;
  const pad=(y1-y0)*.06; y1+=pad; if(y0<0)y0-=pad;
  const X=v=>pl+(v-x0)/(x1-x0||1)*(W-pl-pr), Y=v=>pt+(y1-v)/(y1-y0)*(H-pt-pb);
  const step=niceStep((y1-y0)/4); let ticks=''; for(let t=Math.ceil(y0/step)*step;t<=y1;t+=step){ticks+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="${grid}" stroke-width="${Math.abs(t)<step/1e6?1.2:.6}" ${Math.abs(t)<step/1e6?'':'stroke-dasharray="2 4"'}/><text x="${pl-8}" y="${Y(t)+4}" font-size="10.5" text-anchor="end" fill="${ink}" opacity=".7">${CMP(t)}</text>`}
  let xt=''; const xstep=(x1-x0)>40?10:(x1-x0)>15?5:2; for(let v=Math.ceil(x0/xstep)*xstep;v<=x1;v+=xstep) xt+=`<text x="${X(v)}" y="${H-10}" font-size="10.5" text-anchor="middle" fill="${ink}" opacity=".7">${v}</text>`;
  const mk=markers.filter(m=>m.x>=x0&&m.x<=x1).map(m=>`<line x1="${X(m.x)}" x2="${X(m.x)}" y1="${pt}" y2="${H-pb}" stroke="${ink}" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/><text x="${X(m.x)+5}" y="${pt+11}" font-size="10.5" fill="${ink}">${esc(m.label)}</text>`).join('');
  const paths=series.map(s=>{const d=s.pts.map((p,i)=>`${i?'L':'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('');
    const area=s.fill?`<path d="${d}L${X(s.pts.at(-1)[0])},${Y(0)}L${X(s.pts[0][0])},${Y(0)}Z" fill="${s.fill}" opacity="${s.op??.18}"/>`:'';
    return area+`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.2}" ${s.dash?`stroke-dasharray="${s.dash}"`:''} stroke-linejoin="round"/>`}).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" preserveAspectRatio="xMidYMid meet">${ticks}${xt}${paths}${mk}</svg><div class="legend">${series.filter(s=>s.name).map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div></div>`;
}
function barChart({items,W=720,H=210,ink='currentColor',fmt=CMP,hi=-1,base='#C9BDF5'}){
  const pt=22,pb=34,pl=10,pr=10, max=Math.max(...items.map(i=>i.v||0),1), bw=(W-pl-pr)/Math.max(1,items.length);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${items.map((it,i)=>{const h=(it.v||0)/max*(H-pt-pb), x=pl+i*bw+bw*.18, w=bw*.64, y=H-pb-h;
    return `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h,1)}" rx="5" fill="${it.c||(i===hi?'#9966FF':base)}"/><text x="${x+w/2}" y="${y-6}" font-size="11" text-anchor="middle" fill="${ink}" font-weight="600">${it.v===null?'—':fmt(it.v)}</text><text x="${x+w/2}" y="${H-12}" font-size="11" text-anchor="middle" fill="${ink}" opacity=".75">${esc(it.l)}</text>`}).join('')}</svg></div>`;

function hbar(parts){const tot=parts.reduce((s,p)=>s+Math.max(0,p.v),0)||1;let x=0;

   <p class="hint">A fase de usufruto costuma ter rentabilidade menor, com uma carteira mais conservadora para pagar a renda. Retorno real = (1 + nominal × (1 − IR)) ÷ (1 + IPCA) − 1. Use vírgula para decimais: 12,5.</p></div>

 projetos(c){

   const card=k=>{const x=o[k];

       <label class="toggle"><input type="radio" name="inv${i}" value="nominal" data-path="projetos.${i}.inv.modo" ${p.inv.modo==='nominal'?'checked':''}><span>Usa taxa de juros nominal projetada</span></label>
       ${p.inv.modo==='nominal'?`<div class="grid">${fld('Taxa nominal (% a.a.)',`projetos.${i}.inv.taxa`,'pct')}</div><p class="hint" style="margin-top:6px">Descontados IR (${fmtIn(S.premissas.ir)}%) e IPCA (${fmtIn(S.premissas.ipca)}%) das premissas: ${PCT(((1+num(p.inv.taxa)/100*(1-num(S.premissas.ir)/100))/(1+c.R.ip)-1)*100,2)} a.a. real.</p>`:''}`,
      consorcio:`<div class="grid">${fld('Taxa adm. total (%)',`projetos.${i}.cons.adm`,'pct')}${fld('Fundo de reserva (%)',`projetos.${i}.cons.fr`,'pct')}${fld('Prazo (meses)',`projetos.${i}.cons.prazo`,'int')}</div>
       <label class="toggle"><input type="checkbox" data-path="projetos.${i}.cons.redutor" ${p.cons.redutor?'checked':''}><span>Redutor de parcela</span></label>
       ${p.cons.redutor?`<div class="grid">${sel('Redutor até a contemplação',`projetos.${i}.cons.redPct`,[['10','10%'],['20','20%'],['25','25%'],['30','30%'],['40','40%'],['50','50%']])}</div>`:''}
       <label class="toggle"><input type="checkbox" data-path="projetos.${i}.cons.lanceFixoOn" data-excl="projetos.${i}.cons.lanceLivreOn" ${p.cons.lanceFixoOn?'checked':''}><span>Dar lance fixo todo mês</span></label>
       ${p.cons.lanceFixoOn?`<div class="grid">${fld('Lance fixo (% do crédito)',`projetos.${i}.cons.lanceFixo`,'pct')}</div>`:''}
       <label class="toggle"><input type="checkbox" data-path="projetos.${i}.cons.lanceLivreOn" data-excl="projetos.${i}.cons.lanceFixoOn" ${p.cons.lanceLivreOn?'checked':''}><span>Dar lance livre todo mês</span></label>
       ${p.cons.lanceLivreOn?`<div class="grid">${fld('Lance livre ofertado (% do crédito)',`projetos.${i}.cons.lanceLivre`,'pct')}</div>`:''}
       ${(()=>{const own=p.cons.idxModo==='proprias',ip=own&&p.cons.ipca!==''?p.cons.ipca:S.premissas.ipca,ic=own&&p.cons.inccTx!==''?p.cons.inccTx:S.premissas.incc;return `<div class="idxw"><span class="field"><label>Índice de correção das parcelas e do crédito</label></span>
       <label class="toggle" style="margin-top:6px"><input type="radio" name="idx${i}" value="premissas" data-path="projetos.${i}.cons.idxModo" ${!own?'checked':''}><span>Usar premissas (IPCA ${PCT(num(S.premissas.ipca),1)}, INCC ${PCT(num(S.premissas.incc),1)})</span></label>
       <label class="toggle" style="margin-top:4px"><input type="radio" name="idx${i}" value="proprias" data-path="projetos.${i}.cons.idxModo" ${own?'checked':''}><span>Definir premissas para esta cotação</span></label>
       ${own?`<div class="grid">${fld('IPCA projetado (% a.a.)',`projetos.${i}.cons.ipca`,'pct',`placeholder="${fmtIn(S.premissas.ipca)}"`)}${fld('INCC projetado (% a.a.)',`projetos.${i}.cons.inccTx`,'pct',`placeholder="${fmtIn(S.premissas.incc)}"`)}</div>`:''}
       <div class="idxbar" style="margin-top:10px"><b>IPCA</b><input type="range" min="0" max="100" step="5" value="${num(p.cons.incc)}" data-path="projetos.${i}.cons.incc" data-ip="${num(ip)}" data-ic="${num(ic)}" aria-label="Composição do índice entre IPCA e INCC"><b>INCC</b></div><div class="hint" style="margin-top:4px" id="rl-projetos.${i}.cons.incc">${idxLabel(num(p.cons.incc),ip,ic)}</div></div>`})()}
       ${p.cons.redutor||p.cons.lanceFixoOn||p.cons.lanceLivreOn?`<div class="grid">${fld('Contemplação prevista (mês)',`projetos.${i}.cons.contempla`,'int',`placeholder="${o.mUntil}"`)}</div><p class="hint" style="margin-top:6px">Até a contemplação: ${BRL(o.consorcio.mensal)}/mês.${o.consorcio.lance?` Na contemplação: lance de ${BRL(o.consorcio.lance)}, pago com recursos próprios (sai da reserva).`:''} Depois: ${BRL(o.consorcio.depois)}/mês${o.consorcio.lance?', com o lance abatido do saldo':''}${p.cons.redutor?' e a diferença do redutor diluída':''}. ${p.cons.lanceLivreOn?'Lance livre não garante contemplação: a data é uma estimativa.':'O lance só é pago se a cota for contemplada.'}</p>`:''}`,
      financiar:`<div class="grid">${fld('Juros (% a.a.)',`projetos.${i}.fin.taxa`,'pct')}${fld('Prazo (meses)',`projetos.${i}.fin.prazo`,'int')}${fld('Entrada (%)',`projetos.${i}.fin.entrada`,'pct')}</div>`}[k];
    return `<div class="opt ${p.via===k?'sel':''} ${k===o.best?'best':''}"><div class="opt-head"><small>${lab[k]}</small><button class="pick" data-via="${i}" data-k="${k}">${p.via===k?'Escolhido':'Escolher'}</button></div>
     <b class="v">${BRL(x.mensal)}/mês</b><dl>${x.lance?`<dt>Lance (mês ${x.cont})</dt><dd>${BRL(x.lance)}</dd>`:''}${x.depois?`<dt>Após a contemplação (mês ${x.cont})</dt><dd>${BRL(x.depois)}/mês</dd>`:''}<dt>Prazo</dt><dd>${x.prazo} meses</dd>${x.entrada?`<dt>Entrada</dt><dd>${BRL(x.entrada)}</dd>`:''}<dt>Total pago (R$ de hoje)</dt><dd>${BRL(x.total)}</dd>
     <dt>Custo vs. à vista na data</dt><dd class="${x.custo>0.05?'neg':'pos'}">${x.custo>0.05?'+':''}${PCT(x.custo,1)}</dd><dt>Começa</dt><dd>${x.inicio}</dd></dl>${k===o.best?`<div class="cheap">Mais barato: ${['investir','consorcio','financiar'].filter(z=>z!==k).map(z=>`${BRL(o[z].vsBest)} a menos que ${lab2[z]}`).join(' · ')}</div>`:`<div class="hint" style="margin-top:8px">Custa ${BRL(x.vsBest)} a mais que ${lab2[o.best]}</div>`}${prem}</div>`};
   return `<div class="block"><div class="row" style="grid-template-columns:minmax(160px,2fr) minmax(110px,1fr) minmax(110px,1fr) minmax(80px,.7fr) minmax(95px,.8fr) auto;background:transparent;border:0;padding:0">
    ${fld('Projeto',`projetos.${i}.nome`)}${sel('Tipo',`projetos.${i}.tipo`,['Imóvel','Veículo','Negócio','Viagem','Educação','Outro'])}${fld('Valor de hoje (R$)',`projetos.${i}.valor`,'money')}${fld('Prazo (meses)',`projetos.${i}.prazo`,'int')}${ro('Data prevista',projLabel(p))}${delBtn('projetos',i)}</div>
    <div class="opts">${['investir','consorcio','financiar'].map(card).join('')}</div></div>`}).join('');
  return (cards||'<div class="block"><p class="hint" style="margin:0">Nenhum projeto cadastrado.</p></div>')+`<button class="btn btn-add" data-add="projetos" style="margin-top:0">Adicionar projeto</button>
   <div class="block" style="margin-top:16px"><div class="kpis">${kpi('Consórcios hoje',BRL(c.compromisso)+'/mês')}${kpi('Aportes para projetos via investimento',BRL(c.projInvest)+'/mês')}${kpi('Sobra depois dos projetos',BRL(c.sobraLivre)+'/mês',c.sobraLivre>=0?'pos':'neg')}</div>${c.projGap?`<div class="callout bad">A sobra não cobre os projetos: aos ${c.projGap.idade} anos o patrimônio financeiro fica negativo em ${BRL(c.projGap.valor)}. Adie um projeto, troque a forma de pagamento (consórcio ou financiamento) ou aumente os aportes.</div>`:c.sobraLivre<0?`<div class="callout warn">Os projetos pedem ${BRL(-c.sobraLivre)}/mês além da sobra de hoje. A diferença sai da reserva ou das sobras futuras, quando as dívidas terminarem.</div>`:''}
   <p class="hint">"Custo vs. à vista na data" traz os pagamentos a valor presente pelo retorno da carteira e compara com juntar o dinheiro e pagar à vista na data (o caminho "investir", 0%). A parcela do financiamento é fixa em reais nominais; o custo já considera a inflação. Via investimento o valor sai da reserva na data; via financiamento, a entrada sai da reserva e as parcelas entram nas despesas.</p></div>`;
 },
 independencia(c){
  const A=S.aposentadoria, s=c.sim;
  const ys=s.years.filter(y=>y.working);
  const apMed=ys.length?ys.reduce((t,y)=>t+y.ap,0)/ys.reduce((t,y)=>t+y.meses,0):0;
  const status=s.end>=0?`<div class="callout good">No ritmo atual, a reserva sustenta ${BRL(s.alvo)}/mês dos ${c.idApos} aos ${c.expect} anos e ainda sobram ${BRL(s.end)}.</div>`
   :`<div class="callout bad">No ritmo atual, a reserva acaba aos <b>${s.runOut??s.firstNeg} anos</b>${s.firstNeg!==null&&s.firstNeg<c.idApos?`, e fica negativa já aos ${s.firstNeg}, antes da independência, por causa dos projetos`:''}. Para chegar aos ${c.expect}, é preciso aportar mais ${c.extraConsumir===null?'—':BRL(c.extraConsumir)}/mês até os ${c.idApos}.</div>`;
  const acc=ys.filter((y,i)=>i===0||y.idade%5===0||y.idade===c.idApos).map(y=>`<tr><td>${y.ano}</td><td>${y.idade}</td><td class="r">${BRL(y.ap/y.meses)}</td><td class="r">${BRL(y.rend)}</td><td class="r">${y.proj?BRL(-y.proj):'—'}</td><td class="r">${BRL(y.fim)}</td><td class="r">${BRL(y.fim+y.imob)}</td></tr>`).join('');
  const tab=s.years.filter((y,i)=>y.idade>=c.idApos&&(y.idade%5===0||y.idade===c.idApos||i===s.years.length-1)).map(y=>`<tr><td>${y.ano}</td><td>${y.idade}</td><td class="r">${BRL(y.rec/y.meses)}</td><td class="r">${BRL(y.desp/y.meses)}</td><td class="r">${BRL(y.rend)}</td><td class="r ${y.fim<0?'neg':''}">${BRL(y.fim)}</td></tr>`).join('');
  return `<div class="block"><h2>Meta</h2><div class="grid">
   ${fld('Idade de independência','aposentadoria.idade','int')}${fld('Expectativa de vida','aposentadoria.expectativa','int')}
   ${fld('Renda desejada (R$/mês, de hoje)','aposentadoria.rendaDesejada','money',`placeholder="${fmtIn(Math.round(Math.max(0,c.sim.base)),'money')} (dia a dia atual)"`)}${fld('Rendas garantidas (INSS, aluguéis)','aposentadoria.rendaPassiva','money')}${sel('Estratégia do plano','aposentadoria.estrategia',[['consumir','Consumir a reserva até a expectativa de vida'],['preservar','Viver de renda e preservar a reserva (deixar herança)']])}</div>
   <p class="hint">A estratégia define o aporte extra usado no plano, nos gráficos "com o plano" e na sucessão.</p></div>
   <div class="block"><h2>1. Como o patrimônio cresce até os ${c.idApos}</h2>
   <div class="kpis">${kpi('Patrimônio financeiro hoje',BRL(s.bal0))}${kpi('Aporte médio previsto',BRL(apMed)+'/mês','','sobra investida, já descontados projetos')}${kpi(`Patrimônio financeiro aos ${c.idApos}`,BRL(s.balRet))}${kpi('Rendimentos acumulados',BRL(ys.length?ys.at(-1).cumRend:0))}</div>
   ${accumChart(c)}
   <div class="scroll" style="margin-top:10px"><table class="t"><thead><tr><th>Ano</th><th>Idade</th><th class="r">Aporte médio/mês</th><th class="r">Rendimento no ano</th><th class="r">Saques p/ projetos</th><th class="r">Financeiro</th><th class="r">Total c/ imóveis</th></tr></thead><tbody>${acc}</tbody></table></div></div>
   <div class="block"><h2>2. A reserva sustenta até os ${c.expect}?</h2>${reserveChart(c)}${status}</div>
   <div class="block"><h2>Números-chave</h2><div class="kpis">
    ${kpi('Renda sustentável hoje',BRL(c.rendaSust)+'/mês',c.rendaSust>=s.alvo?'pos':'neg',`até os ${c.expect} anos`)}
    ${kpi('Aporte extra para consumir a reserva',c.extraConsumir===null?'—':BRL(c.extraConsumir)+'/mês','',`acaba aos ${c.expect}`)}
    ${kpi('Aporte extra para viver de renda',c.extraPreservar===null?'—':BRL(c.extraPreservar)+'/mês','','reserva preservada')}</div></div>
   <div class="block"><h2>Renda sustentável conforme o retorno real</h2>${barChart({items:c.sens.map(x=>({l:PCT(x.r,0)+' a.a.',v:x.v})),hi:c.sens.reduce((b,x,i)=>Math.abs(x.r-c.R.ra*100)<Math.abs(c.sens[b].r-c.R.ra*100)?i:b,0)})}
   <p class="hint">Renda mensal que a poupança atual sustenta até os ${c.expect} anos para cada retorno real, aplicado a todo o período. Em roxo, o mais próximo da premissa (${PCT(c.R.ra*100,2)}). Meta: ${BRL(s.alvo)}/mês.</p></div>
   <div class="block"><h2>Fase de usufruto, ritmo atual</h2><div class="scroll"><table class="t"><thead><tr><th>Ano</th><th>Idade</th><th class="r">Rendas/mês</th><th class="r">Despesa/mês</th><th class="r">Rendimento no ano</th><th class="r">Reserva final</th></tr></thead><tbody>${tab}</tbody></table></div></div>`;
 },
 protecao(c){

   ${fld('Seguro de vida atual (R$)','protecao.seguroAtual','money')}${fld('Assistência funeral (R$)','protecao.funeral','money')}${fld('Doenças graves: meses de despesa','protecao.mesesDG','int')}</div>

   <label class="toggle"><input type="checkbox" data-path="protecao.reduzir" ${S.protecao.reduzir?'checked':''}><span>Reduzir as despesas da família após o falecimento do titular<br><span class="hint" style="margin:0">A despesa pessoal do titular deixa de existir. Sem a caixa marcada, a família mantém 100% do dia a dia.</span></span></label>
   ${S.protecao.reduzir?`<div class="grid" style="margin-top:10px">${sel('Redução das despesas','protecao.reducao',[['10','10%'],['15','15%'],['20','20%'],['25','25%'],['30','30%'],['40','40%'],['50','50%']])}${ro('Dia a dia mantido pela família',BRL(c.sim.base*famPct()/100)+'/mês')}</div>`:''}</div>
   <div class="block"><h2>Necessidade de capital em caso de morte ou invalidez</h2><div class="scroll"><table class="t"><thead><tr><th>Componente</th><th>Base</th><th class="r">Valor presente</th></tr></thead><tbody>

   <tr class="tot"><td>Capital a contratar</td><td></td><td class="r neg">${BRL(c.gap)}</td></tr></tbody></table></div>

 },
 sucessao(c){
  const lbl=['Hoje',`Na independência (${c.idApos})`,`Na expectativa de vida (${c.expect})`];
  const row=(v,i,pl)=>`<tr><td>${lbl[i]}</td><td class="r">${BRL(v.base)}</td><td class="r">${PCT(v.ef,2)}</td><td class="r">${BRL(v.itcmd)}</td><td class="r">${BRL(v.outros)}</td><td class="r"><b>${BRL(v.total)}</b></td></tr>`;

document.getElementById('importFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const n=mergeImport(JSON.parse(await f.text()));render();modal(`<h3>Backup importado</h3><p class="hint">${n} cliente(s) novo(s) ou mais recente(s) foram carregados. Clientes mais novos neste navegador foram mantidos.</p><div class="nav"><span></span><button class="btn btn-primary" data-close>Fechar</button></div>`)}
  catch(err){modal(`<h3>Arquivo inválido</h3><p class="hint">Selecione um backup .json gerado pelo Planejador Financeiro.</p><div class="nav"><span></span><button class="btn btn-primary" data-close>Fechar</button></div>`)}});
document.addEventListener('click',async e=>{const t=e.target, q=s=>t.closest(s);let b;
  if(q('[data-close]')||(t.matches&&t.matches('[data-close-bg]'))){closeModal();return}
  if(PRES.on){
    if(q('[data-presclose]')){PRES.on=false;renderPres();if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});return}
    if(q('[data-presfull]')){const el=document.querySelector('.pres');try{if(!document.fullscreenElement)await el.requestFullscreen();else await document.exitFullscreen()}catch(_){}return}
    if(b=q('[data-presgo]')){PRES.i+=+b.dataset.presgo;renderPres();return}
    if(b=q('[data-presi]')){PRES.i=+b.dataset.presi;renderPres();return}
    if(q('[data-povreset]')){PRES.ov={};renderPres();return}
    return}
  if(q('[data-home]')){goHome();return}
  if(b=q('[data-filter]')){HOME.f=b.dataset.filter;render();return}
  if(q('[data-newclient]')){const c=newClient();DB.clients[c.id]=c;dirtyIds.add(c.id);scheduleSave();openClient(c.id);return}
  if(q('[data-example]')){let ex=Object.values(DB.clients).find(c=>c.exemplo);if(!ex){ex=newClient(exampleData());ex.exemplo=true;DB.clients[ex.id]=ex;dirtyIds.add(ex.id);scheduleSave()}openClient(ex.id);return}
  if(b=q('[data-open]')){openClient(b.dataset.open);return}
  if(b=q('[data-revise]')){const c=DB.clients[b.dataset.revise];if(!c.summary){S=c.data;c.summary=summaryOf(calc({light:true}))}
    c.versions.push({at:Date.now(),summary:c.summary,data:clone(c.data)});if(c.versions.length>20)c.versions.shift();c.reaberto=true;c.updatedAt=Date.now();dirtyIds.add(c.id);scheduleSave();openClient(c.id);return}
  if(b=q('[data-dup]')){const o=DB.clients[b.dataset.dup];const c=newClient(clone(o.data));c.data.cliente.nome=(o.data.cliente.nome||'Cliente')+' (cópia)';DB.clients[c.id]=c;dirtyIds.add(c.id);scheduleSave();render();return}
  if(b=q('[data-delc]')){const c=DB.clients[b.dataset.delc];modal(`<h3>Excluir ${esc(c.data.cliente.nome||'este cliente')}?</h3><p class="hint">O cliente vai para a lixeira e pode ser restaurado por 30 dias. Depois disso, é apagado de vez.</p><div class="nav"><button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" style="background:var(--bad)" data-confirmdel="${c.id}">Excluir</button></div>`);return}
  if(b=q('[data-confirmdel]')){const id=b.dataset.confirmdel;DB.trash[id]={...DB.clients[id],deletedAt:Date.now()};delete DB.clients[id];dirtyIds.add(id);scheduleSave();closeModal();render();return}
  if(b=q('[data-restore]')){const id=b.dataset.restore,c=DB.trash[id];delete c.deletedAt;c.updatedAt=Date.now();DB.clients[id]=c;delete DB.trash[id];dirtyIds.add(id);scheduleSave();render();return}
  if(b=q('[data-purge]')){const id=b.dataset.purge;modal(`<h3>Excluir definitivamente?</h3><p class="hint">${esc(DB.trash[id].data.cliente.nome||'Este cliente')} será apagado de vez e não poderá ser recuperado pelo app (só por um backup antigo).</p><div class="nav"><button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" style="background:var(--bad)" data-purgeok="${id}">Excluir de vez</button></div>`);return}
  if(b=q('[data-purgeok]')){delete DB.trash[b.dataset.purgeok];scheduleSave();closeModal();render();return}
  if(q('[data-folder]')){connectFolder();return}
  if(q('[data-reconnect]')){reconnectFolder();return}
  if(q('[data-export]')){DB.settings.lastBackup=Date.now();await flushSave();downloadFile(`planejador-backup-${NOW.toISOString().slice(0,10)}.json`,JSON.stringify(DB,null,1),'application/json');return}
  if(q('[data-import]')){document.getElementById('importFile').click();return}
  if(q('[data-importforms]')){document.getElementById('importForms').click();return}
  if(q('[data-selfdl]')){downloadFile('planejador-financeiro.html',SELF_HTML,'text/html');return}
  if(b=q('[data-go]')){cur=+b.dataset.go;render();window.scrollTo({top:0});return}
  if(!S)return;
  if(b=q('[data-via]')){S.projetos[+b.dataset.via].via=b.dataset.k;touch();render();return}
  if(b=q('[data-del]')){S[b.dataset.del].splice(+b.dataset.i,1);touch();render();return}
  if(b=q('[data-add]')){const k=b.dataset.add;const t={familia:{nome:'',parentesco:'Filho(a)',nasc:'',dependente:true,coberturaAte:24,fases:clone(S.premissas.fases)},
    patrimonio:{tipo:'Investimentos',desc:'',inst:'',valor:'',fin:{on:false,meses:'',saldo:'',parcela:''}},dividas:{desc:'',tipo:'Veículo',saldo:'',meses:12,parcela:''},
    projetos:{nome:'Novo projeto',tipo:'Outro',valor:100000,prazo:36,via:'investir',fin:{taxa:14,prazo:60,entrada:20},cons:{adm:18,fr:2,prazo:100}}}[k];S[k].push(t);touch();render();return}
  if(b=q('[data-kidtab]')){KIDTAB=b.dataset.kidtab;render();return}
  if(b=q('[data-prio]')){const t=b.dataset.prio,i=S.prioridadesSel.indexOf(t);if(i>=0)S.prioridadesSel.splice(i,1);else S.prioridadesSel.push(t);touch();render();return}
  if(b=q('[data-addp]')){const T={'fluxo.receitas':{tipo:'Pró-labore',desc:'',valor:'',ate:'',continua:false},'fluxo.despesas':{cat:'Moradia',desc:'',valor:''}};getP(b.dataset.addp).push(clone(T[b.dataset.addp]));touch();render();return}
  if(b=q('[data-delp]')){getP(b.dataset.delp).splice(+b.dataset.i,1);touch();render();return}
  if(b=q('[data-link]')){const d=S.dividas[+b.dataset.link];S.patrimonio.push({tipo:d.tipo==='Imóvel'?'Imóvel':'Veículo',desc:d.desc,inst:'',valor:'',fin:{on:true,meses:d.meses,saldo:d.saldo,parcela:d.parcela}});S.dividas.splice(+b.dataset.link,1);touch();cur=2;render();window.scrollTo({top:0});modal(`<h3>Bem cadastrado</h3><p class="hint">${esc(d.desc||'O bem')} agora está em Patrimônio, com o financiamento vinculado. Informe o valor de mercado para o patrimônio líquido ficar correto.</p><div class="nav"><span></span><button class="btn btn-primary" data-close>Entendi</button></div>`);return}
  if(b=q('[data-addfase]')){const arr=getP(b.dataset.addfase);const last=arr.at(-1);arr.push({nome:'Nova fase',de:last?num(last.ate)+1:0,ate:last?num(last.ate)+3:3,edu:0,outros:0});touch();render();return}
  if(b=q('[data-delfase]')){getP(b.dataset.delfase).splice(+b.dataset.i,1);touch();render();return}
  if(b=q('[data-applyfase]')){const v=b.dataset.applyfase;if(v==='all')kids().forEach(k=>k.fases=clone(S.premissas.fases));else S.familia[+v].fases=clone(S.premissas.fases);touch();render();return}
  if(q('[data-print]')){await flushSave();window.print();return}
  if(q('[data-present]')){PRES.on=true;PRES.i=0;PRES.ov={};renderPres();return}
  if(q('[data-deliver]')){CUR.entregueEm=Date.now();CUR.reaberto=false;touch();render();return}
});
window.addEventListener('afterprint',()=>{});
render();restoreFolder();initCloud();
</script>
</body></html>
